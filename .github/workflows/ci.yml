name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: 'npm'

      - name: Install isolated npm 12.0.2
        run: |
          npm install --global --prefix "${RUNNER_TEMP}/npm-12.0.2" npm@12.0.2 --ignore-scripts --no-audit --no-fund
          echo "${RUNNER_TEMP}/npm-12.0.2/bin" >> "${GITHUB_PATH}"

      - name: Verify npm version
        run: test "$(npm --version)" = "12.0.2"

      - name: Validate lockfile release age
        run: npm run check:lockfile-age

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify package signatures
        run: npm audit signatures

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build release artifacts
        run: npm run build:release

  execution-platforms:
    name: Execution lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: 'npm'

      - name: Install isolated npm 12.0.2
        shell: bash
        run: |
          npm install --global --prefix "${RUNNER_TEMP}/npm-12.0.2" npm@12.0.2 --ignore-scripts --no-audit --no-fund
          if [ "${RUNNER_OS}" = "Windows" ]; then
            echo "${RUNNER_TEMP}/npm-12.0.2" >> "${GITHUB_PATH}"
          else
            echo "${RUNNER_TEMP}/npm-12.0.2/bin" >> "${GITHUB_PATH}"
          fi

      - name: Verify npm version
        shell: bash
        run: test "$(npm --version)" = "12.0.2"

      - name: Install dependencies
        run: npm ci

      - name: Verify execution contracts
        run: npm run test -- --selectProjects unit --runInBand tests/unit/core/execution/local/LocalShellBackend.test.ts tests/unit/app/execution/local/NodeLocalShellProcessAdapter.test.ts tests/unit/providers/antigravity/AntigravityExecutionBackend.test.ts tests/unit/providers/antigravity/AntigravityExecutionConformance.test.ts tests/unit/providers/antigravity/AntigravityExecutionLifecycle.test.ts tests/unit/providers/antigravity/AntigravityPrintProcessRunner.test.ts tests/unit/app/execution/antigravity/NodeAntigravityProcessTransport.test.ts

      - name: Verify host process ownership
        run: npm run test -- --selectProjects integration --runInBand tests/integration/app/execution/local/LocalShellProcessOwnership.integration.test.ts tests/integration/app/execution/antigravity/NodeAntigravityProcessTransport.integration.test.ts
