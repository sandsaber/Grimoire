name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is on main
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) must point to a commit on origin/main."
            exit 1
          fi

      - name: Setup Node 22.22.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: 'npm'

      - name: Install isolated npm 12.0.2
        run: |
          npm install --global --prefix "${RUNNER_TEMP}/npm-12.0.2" npm@12.0.2 --ignore-scripts --no-audit --no-fund
          echo "${RUNNER_TEMP}/npm-12.0.2/bin" >> "${GITHUB_PATH}"

      - name: Verify npm version
        run: test "$(npm --version)" = "12.0.2"

      - name: Validate lockfile release age
        run: npm run check:lockfile-age

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify package signatures
        run: npm audit signatures

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --selectProjects unit

      - name: Validate release metadata
        run: node scripts/check-release-metadata.mjs

      - name: Build release bundle
        run: npm run build:release

      - name: Verify release version
        run: |
          node -e '
          const fs = require("fs");
          const tag = process.env.GITHUB_REF_NAME;
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync("dist/grimoire/manifest.json", "utf8"));
          if (pkg.version !== tag || manifest.version !== tag) {
            console.error("Release tag " + tag + " must match package.json (" + pkg.version + ") and manifest.json (" + manifest.version + ").");
            process.exit(1);
          }
          '

      - name: Verify release assets
        run: |
          test -s dist/grimoire/main.js
          test -s dist/grimoire/manifest.json
          test -s dist/grimoire/styles.css

      - name: Generate release notes
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          current_commit="$(git rev-list -n 1 "${tag}")"
          previous_tag="$(
            git tag --merged "${current_commit}" --sort=-v:refname \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -v "^${tag}$" \
              | head -n 1 || true
          )"
          node scripts/generate-release-notes.mjs \
            --tag "${tag}" \
            --previous-tag "${previous_tag}" \
            --output RELEASE_NOTES.md

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/grimoire/main.js
            dist/grimoire/manifest.json
            dist/grimoire/styles.css
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      # gh release create --verify-tag shells out to git; the publish job
      # otherwise only has downloaded artifacts and is not a repository checkout.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Verify release assets
        run: |
          test -s release-assets/dist/grimoire/main.js
          test -s release-assets/dist/grimoire/manifest.json
          test -s release-assets/dist/grimoire/styles.css
          test -s release-assets/RELEASE_NOTES.md

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/dist/grimoire/main.js
            release-assets/dist/grimoire/manifest.json
            release-assets/dist/grimoire/styles.css

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          title="Grimoire ${tag}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --title "${title}" \
              --target "${GITHUB_SHA}" \
              --notes-file release-assets/RELEASE_NOTES.md
            gh release upload "${tag}" \
              release-assets/dist/grimoire/main.js \
              release-assets/dist/grimoire/manifest.json \
              release-assets/dist/grimoire/styles.css \
              --clobber
          else
            gh release create "${tag}" \
              release-assets/dist/grimoire/main.js \
              release-assets/dist/grimoire/manifest.json \
              release-assets/dist/grimoire/styles.css \
              --title "${title}" \
              --target "${GITHUB_SHA}" \
              --notes-file release-assets/RELEASE_NOTES.md \
              --verify-tag
          fi
